name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -s sh src/memorylogger src/koreader-boot
      - run: python3 build.py
      - uses: actions/upload-artifact@v7
        with:
          name: tolino-koreader-boot
          path: dist/tolino-koreader-boot.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: python3 build.py
      - run: gh release create "$GITHUB_REF_NAME" dist/tolino-koreader-boot.zip --title "$GITHUB_REF_NAME" --notes-file RELEASE.md
        env:
          GH_TOKEN: ${{ github.token }}
